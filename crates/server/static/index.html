<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --muted: #8a91a0;
          --crit: #ff4d4f; --warn: #faad14; --info: #1677ff; --border: #262b36; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
         background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; }
  #filters { padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
  #filters select { background: var(--panel); color: var(--text);
        border: 1px solid var(--border); padding: 4px 8px; font: inherit; font-size: 12px; }
  #events { padding: 8px 20px 40px; }
  .ev { border: 1px solid var(--border); border-left-width: 4px; border-radius: 4px;
        margin: 8px 0; background: var(--panel); padding: 10px 12px; cursor: pointer; }
  .ev.critical { border-left-color: var(--crit); }
  .ev.warning  { border-left-color: var(--warn); }
  .ev.info     { border-left-color: var(--info); }
  .ev .top { display: flex; gap: 10px; align-items: baseline; }
  .badge { font-size: 10px; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
  .badge.critical { background: var(--crit); color: #fff; }
  .badge.warning  { background: var(--warn); color: #000; }
  .badge.info     { background: var(--info); color: #fff; }
  .time { color: var(--muted); font-size: 11px; }
  .summary { flex: 1; }
  .host { color: var(--muted); font-size: 11px; }
  .evidence { display: none; margin-top: 8px; border-top: 1px solid var(--border);
              padding-top: 8px; font-size: 12px; color: var(--muted); }
  .ev.open .evidence { display: block; }
  #empty { color: var(--muted); padding: 20px; text-align: center; }
  #err { color: var(--crit); padding: 10px 20px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Watchtower</h1>
  <span id="status">connecting…</span>
</header>
<div id="err"></div>
<div id="filters">
  <select id="f-kind"><option value="">all kinds</option></select>
  <select id="f-sev">
    <option value="">all severities</option>
    <option value="Critical">critical</option>
    <option value="Warning">warning</option>
    <option value="Info">info</option>
  </select>
</div>
<div id="events"></div>
<div id="empty">no events yet — install the agent and wait.</div>
<script src="/app.js"></script>
</body>
</html>
